<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Banner Effect</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: serif;
  }

  body {
    height: 200vh; /* allow scrolling */
  }

  .banner {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
  }

  /* Background image */
  .banner img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.2s linear;
  }

  /* Text */
  .banner h1 {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1.5);
    font-size: 10vw;
    letter-spacing: 5px;
    color: black;
    opacity: 0;
    transition: transform 0.2s linear, opacity 0.2s linear;
  }

</style>
</head>

<body>

<div class="banner">
  <img src="./hero5.jpg" id="bg">
  <h1 id="text">DIRECTION</h1>
</div>

<script>
  const bg = document.getElementById("bg");
  const text = document.getElementById("text");

  window.addEventListener("scroll", () => {
    let scroll = window.scrollY;
    let maxScroll = window.innerHeight;

    let progress = Math.min(scroll / maxScroll, 1);

    // Fade out background
    bg.style.opacity = 1 - progress;

    // Fade in + zoom out text
    text.style.opacity = progress;
    text.style.transform = `translate(-50%, -50%) scale(${1.5 - progress * 0.5})`;
  });
</script>

</body>
</html>
