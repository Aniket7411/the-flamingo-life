<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <title>Product Layout</title>

  <style>
    body {
      font-family: 'Josefin Sans', sans-serif;
    }
  </style>
</head>

<body class="bg-[#f4f4f4]">

<section class="w-full px-4 md:px-10 lg:px-16 py-10 md:py-16">

  <!-- GRID -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16 items-start">

    <!-- LEFT LARGE IMAGE -->
    <div class="w-full">
      <img 
        src="https://images.unsplash.com/photo-1520975916090-3105956dac38?q=80&w=1200"
        alt="Product"
        class="w-full h-auto object-cover"
      />
    </div>

    <!-- RIGHT CONTENT -->
    <div class="flex flex-col justify-start">

      <!-- TITLE -->
      <h2 class="text-3xl md:text-4xl lg:text-5xl font-light tracking-wide uppercase mb-4 leading-tight">
        DROP 6 THE ARGYLE KNIT SET
      </h2>

      <!-- SUBTEXT -->
      <p class="text-sm text-gray-600 mb-6">
        Model is 5'11" / 180cm, wearing size one size.
      </p>

      <!-- PRICE -->
      <p class="text-xl md:text-2xl font-medium mb-6">
        $500.0
      </p>

      <!-- BUTTON -->
      <button class="bg-black text-white px-8 py-3 w-fit hover:bg-gray-800 transition tracking-wide">
        View Details
      </button>

    </div>

  </div>

  <!-- BOTTOM OFFSET IMAGE -->
  <div class="mt-10 md:mt-16 flex justify-end">
    <div class="w-full md:w-[60%] lg:w-[55%]">
      <img 
        src="https://images.unsplash.com/photo-1520974735194-75a0c5f1f91f?q=80&w=1000"
        alt="Product Secondary"
        class="w-full h-auto object-cover"
      />
    </div>
  </div>

</section>

</body>
</html>
