  <!-- PANEL 1 -->
  <div class="panel">

    <div class="overlay overlay-1"></div>

  <!-- PANEL 2 -->
  <div class="panel">
    <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1200" />
    <div class="overlay overlay-2"></div>
    <button class="btn">BUY NOW</button>

  <!-- PANEL 3 -->
  <div class="panel">
    <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?q=80&w=1200" />
    <div class="overlay overlay-3"></div>
    <button class="btn">BUY NOW</button>

  <div class="panel">

    <div class="overlay overlay-4"></div>

  </div>

</div>

<!-- STYLES -->
<style>
.split-section {
  display: flex;
  flex-wrap: wrap;
  height: 100vh;
}

/* 4 GRID */
.panel {
  position: relative;
  width: 50%;
  height: 50%;
  overflow: hidden;
}

/* Images */
.panel img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Overlay */
.overlay {
  position: absolute;
  inset: 0;
  background: white;
  transform: translateY(0%);
  transition: transform .6s ease;
  z-index: 2;
}

/* Button */
.btn {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 24px;
  border: 1px solid black;
  background: transparent;
  letter-spacing: 2px;
  cursor: pointer;
  z-index: 3;
}

/* Reveal */
.reveal {
  transform: translateY(100%);
}

/* 📱 MOBILE → 2 per row */
@media (max-width: 768px) {
  .split-section {
    height: auto;
  }

  .panel {
    width: 50%;
    height: 50vh;
  }
}
</style>

<!-- SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  const section = document.querySelector(".split-section");
  const overlays = document.querySelectorAll(".overlay");

  let triggered = false;

  function handleScroll() {
    const rect = section.getBoundingClientRect();

    if (!triggered && rect.top < window.innerHeight * 0.8) {
      triggered = true;

      overlays.forEach((overlay, index) => {
        setTimeout(() => {
          overlay.classList.add("reveal");
        }, index * 300); // stagger effect 🔥
      });
    }
  }

  window.addEventListener("scroll", handleScroll);
});
</script>
